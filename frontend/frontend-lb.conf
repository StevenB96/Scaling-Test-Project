# Event block - not configured, but required for Nginx operation
events {}

http {
  # Define an upstream group for frontend servers (load balancing between frontend1 and frontend2)
  upstream fe_upstream {
    server frontend1:80;  # Frontend container 1
    server frontend2:80;  # Frontend container 2
  }

  # Define the server block to listen on port 80 for incoming HTTP requests
  server {
    listen 80;  # Nginx will listen on port 80

    # Location block for the root path '/'
    # This is used to serve static files and proxy requests to the frontend servers
    location / {
      proxy_pass http://fe_upstream;  # Forward requests to the frontend upstream group
      proxy_set_header Host $host;    # Pass the original host header
      proxy_set_header X-Real-IP $remote_addr;  # Pass the real IP address of the client
    }

    # Location block for the /api/ path
    # This forwards API-related requests to the API load balancer (backend-lb)
    location /api/ {
      proxy_pass http://backend-lb:5000/;  # Forward API requests to the backend load balancer
      proxy_set_header Host $host;     # Pass the original host header
      proxy_set_header X-Real-IP $remote_addr;  # Pass the real IP address of the client
    }
  }
}
