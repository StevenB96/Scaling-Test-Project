<!DOCTYPE html>
<html lang="en">
<head>
	<!-- Set the character encoding for the document to UTF-8 (supports many languages and special characters) -->
	<meta charset="UTF-8">

	<!-- Set the title of the page (appears in the browser tab) -->
	<title>Price Tracker</title>
</head>
<body>
	<!-- Main heading of the page -->
	<h1>Tracked Products</h1>

	<!-- Unordered list where the products will be displayed dynamically -->
	<ul id="products"></ul>

	<!-- Button that triggers the price check when clicked -->
	<button onclick="triggerCheck()">Check Prices</button>

	<!-- Link to the external JavaScript file that contains the logic for loading products and triggering the price check -->
	<script src="script.js"></script>
</body>
</html>
