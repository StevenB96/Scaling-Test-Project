# Set the number of worker processes
# Adjusting this value allows for more concurrency by handling more connections at the same time.
worker_processes 1;

# Configure event handling for Nginx
events {
  # worker_connections: This defines the maximum number of simultaneous connections each worker can handle.
  worker_connections 1024;  # Allow up to 1024 simultaneous connections per worker process.
}

http {
  # Define an upstream group of backend servers for load balancing
  # This is used to distribute traffic between multiple backend services (Flask apps).
  upstream backend_upstream {
    server backend:5000;   # The first Flask backend container (backend)
    server backend2:5000;  # The second Flask backend container (backend2)
  }

  # Define the server block that listens on port 5000
  # Nginx will listen for incoming requests on this port.
  server {
    listen 5000;  # Nginx listens on port 5000 for incoming requests

    # Location block for the root path '/'
    # All HTTP requests coming to the root path are forwarded to the upstream backend group.
    location / {
      # Forward all HTTP requests to the backend upstream group (load balancing between backend and backend2)
      proxy_pass http://backend_upstream;
    }
  }
}
