# Set the number of worker processes (can be adjusted for more concurrency)
worker_processes 1;

# Configure event handling
events {
  worker_connections 1024;  # Maximum number of simultaneous connections per worker
}

http {
  # Define an upstream group of backend servers for load balancing
  upstream backend_upstream {
    server backend:5000;   # First Flask backend container
    server backend2:5000;  # Second Flask backend container
  }

  # Define the server block that listens on port 5000
  server {
    listen 5000;  # NGINX listens on port 5000

    location / {
      # Forward all HTTP requests to the backend upstream group
      proxy_pass http://backend_upstream;
    }
  }
}
