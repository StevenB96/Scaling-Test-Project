version: '3.8'

services:
  # ----- MongoDB Shard Cluster -----
  # Configuration server holding cluster metadata
  configsvr:
    image: mongo:6
    command: mongod --configsvr --replSet configReplSet --port 27019
    volumes:
      - configsvr_data:/data/db  # Persist config server data
    networks:
      - mongo-cluster           # Isolated network for MongoDB internal communication

  # First shard for horizontal scaling
  shard1:
    image: mongo:6
    command: mongod --shardsvr --replSet shard1ReplSet --port 27018
    volumes:
      - shard1_data:/data/db     # Persist shard 1 data
    networks:
      - mongo-cluster

  # Second shard for horizontal scaling
  shard2:
    image: mongo:6
    command: mongod --shardsvr --replSet shard2ReplSet --port 27018
    volumes:
      - shard2_data:/data/db     # Persist shard 2 data
    networks:
      - mongo-cluster

  # Mongos router that multiplexes queries to config server & shards
  mongos:
    image: mongo:6
    command: mongos --configdb configReplSet/configsvr:27019 --port 27017
    depends_on:
      - configsvr                 # Ensure config server is up
      - shard1                    # Ensure first shard is up
      - shard2                    # Ensure second shard is up
    ports:
      - "27017:27017"            # Expose mongos on host for clients
    networks:
      - mongo-cluster
      - backend-network           # Also attach to backend network for API connectivity

  # Initialization job: sets up replica sets & sharding
  mongo-setup:
    image: mongo:6
    depends_on:
      - configsvr
      - shard1
      - shard2
      - mongos
    volumes:
      - ./mongo-init:/docker-entrypoint-initdb.d  # Scripts to initialize cluster
    entrypoint: ["mongosh", "/docker-entrypoint-initdb.d/setup.js"]
    networks:
      - mongo-cluster
      - backend-network

  # ----- Redis Broker for Celery -----
  redis:
    image: redis:7
    ports:
      - "6379:6379"            # Expose Redis on default port
    networks:
      - backend-network         # Only backend services need access

  # ----- Flask Backend API -----
  backend: &backend
    build: ./backend           # Build context for Flask app
    environment:
      - MONGO_URI=mongodb://mongos:27017   # Connect via mongos router
      - REDIS_URL=redis://redis:6379/0     # Use Redis for Celery broker
    expose:
      - "5000"               # Expose port internally
    depends_on:
      - mongos
      - redis
    networks:
      - backend-network        # Internal backend network

  # Second replica of Flask API for horizontal scaling
  backend2:
    <<: *backend                # Inherit configuration from 'backend'

  # Nginx load balancer for Flask replicas
  backend-lb:
    image: nginx:alpine
    ports:
      - "5000:5000"          # Expose API on host port 5000
    volumes:
      - ./backend/backend-lb.conf:/etc/nginx/nginx.conf:ro  # Mount custom Nginx config
    depends_on:
      - backend
      - backend2
    networks:
      - backend-network

  # ----- Celery Worker Services -----
  celery_worker1: &celery_worker1
    build: ./backend           # Reuse Flask Dockerfile for Celery
    command: celery -A celery_worker.app worker --loglevel=info  # Start Celery worker
    environment:
      - MONGO_URI=mongodb://mongos:27017
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis
      - mongos
    networks:
      - backend-network

  # Second Celery worker for high availability
  celery_worker2:
    <<: *celery_worker1

  # ----- Frontend Static Servers & Load Balancer -----
  frontend1:
    build: ./frontend         # Build context for Express static server
    expose:
      - "80"                # Expose HTTP port internally
    networks:
      - frontend-network      # Frontend isolated network

  frontend2:
    build: ./frontend
    expose:
      - "80"
    networks:
      - frontend-network

  # Nginx load balancer for frontend replicas
  frontend-lb:
    image: nginx:alpine
    ports:
      - "8080:80"            # Expose frontend on host port 8080
    volumes:
      - ./frontend/frontend-lb.conf:/etc/nginx/nginx.conf:ro  # Custom Nginx config
    depends_on:
      - frontend1
      - frontend2
    networks:
      - frontend-network      # HTTP traffic network
      - backend-network       # Also attach to backend to proxy API calls

networks:
  mongo-cluster:               # Network for MongoDB internal communication
  backend-network:             # Shared by backend services (API, Celery, mongos)
  frontend-network:            # Shared by front-end servers & load balancer

volumes:
  configsvr_data:              # Persistent volume for config server
  shard1_data:                 # Persistent volume for shard1
  shard2_data:                 # Persistent volume for shard2
